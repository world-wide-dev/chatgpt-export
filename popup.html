<!DOCTYPE html>
<html>
  <head>
    <title>ChatGPT Exporter</title>
    <style>
      body {
        width: 8rem;
        color: seashell;
        background-color: black;
      }
      .action-button {
        line-height: 1.5;
      }
      .action-button:hover {
        cursor: pointer;
      }
      #page-load-block {
        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;

        background-color: rgba(0,0,0,.5);

        z-index: 9999;
      }
      #page-loading {
        width: 24px;
        height: 24px;

        border: 3px solid #666;
        border-top-color: white;

        border-radius: 50%;

        animation:
          spin 1s linear infinite;
      }
      #page-loading-label {
        font-weight: 800;
        font-size: 120%;
      }
      .popup-warning {
        text-align: center;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <h3>ChatGPT Export</h3>
    <hr/>
    <div class="action-button" id="extract">[ Extract Conversation ]</div>
    <hr/>
    <div class="action-button" id="export-md">[ Export Markdown ]</div>
    <div class="action-button" id="export-html">[ Export HTML ]</div>
    <div class="action-button" id="export-json">[ Export JSON ]</div>
    <div class="action-button" id="export-all">[ Export All ]</div>
    <div id="page-load-block">
      <div id="page-loading"></div>
      <span id="page-loading-label">Awaiting page load...</span>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
